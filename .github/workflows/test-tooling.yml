name: Native tooling
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun test:contracts
      - run: bash .github/scripts/selftest-swift-packages-exit.sh
      - run: bash .github/scripts/macos-release-launch-smoke.test.sh
